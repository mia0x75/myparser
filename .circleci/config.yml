version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.27.3
    steps:
      - checkout
      - run:
          name: Verify generated parser is up to date
          command: |
            cp parser.go /tmp/parser.go.committed
            make parser
            diff -u /tmp/parser.go.committed parser.go
      - run:
          name: Check formatting
          command: |
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "Unformatted files:"
              echo "$unformatted"
              exit 1
            fi
      - run:
          name: Vet
          command: go vet ./...
      - run:
          name: Build and test
          command: make test

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
